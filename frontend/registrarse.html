<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnify | Registrarse</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-wrapper">
        
        <!-- Brand / Logo -->
        <div class="brand">
            <a href="bienvenida.html" class="brand-logo">
                <div class="brand-icon">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <div class="brand-text">
                    <span>Learnify</span>
                </div>
            </a>
            <div class="brand-subtitle">Plataforma educativa inteligente</div>
        </div>

        <!-- Tarjeta de Registro -->
        <div class="login-card">

            <div class="login-header">
                <h2>Crear Cuenta</h2>
                <p>Regístrate para comenzar a aprender.</p>
            </div>

            <!-- Mensaje de éxito/error -->
            <div id="mensaje" class="mensaje">
                <i class="fas fa-check-circle"></i>
                <span id="mensaje-texto"></span>
            </div>

            <!-- Formulario -->
            <form id="formulario-registro">

                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-user"></i></span>
                        <input type="text" id="nombre" placeholder="Tu nombre completo">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="email" placeholder="ejemplo@correo.com">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-lock"></i></span>
                        <input type="password" id="password" placeholder="Mínimo 6 caracteres">
                        <button type="button" class="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="rol">Rol</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-user-tag"></i></span>
                        <select id="rol">
                            <option value="">Selecciona tu rol</option>
                            <option value="alumno">🎓 Alumno</option>
                            <option value="maestro">👨‍🏫 Maestro</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-user-plus"></i>
                    <span>Registrarse</span>
                </button>

            </form>

            <div class="login-footer">
                <p>
                    ¿Ya tienes cuenta? 
                    <a href="iniciar_sesion.html">Inicia sesión</a>
                </p>
                <a href="bienvenida.html" class="back-home">
                    <i class="fas fa-arrow-left"></i> Volver al inicio
                </a>
            </div>

        </div>
    </div>

    <!-- ✅ SCRIPT DE AUTENTICACIÓN -->
    <script src="js/autenticacion.js"></script>

</body>
</html>
