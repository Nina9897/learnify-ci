<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnify | Mis Estadías</title>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/menu.css">
    <link rel="stylesheet" href="../../css/estadias.css">
    <link rel="stylesheet" href="../../css/modal_editar_perfil.css">
    <link rel="stylesheet" href="../../css/temas_oscuro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
 
</head>
<body class="menu-lateral">
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-graduation-cap"></i><span> Learnify</span></h2>
            </div>
            <nav class="sidebar-nav">
                <a href="../../dashboard.html" class="menu-item">
                    <i class="fas fa-chart-line"></i><span> Dashboard</span>
                </a>
                <a href="../../pages/mis_equipos.html" class="menu-item">
                    <i class="fas fa-users"></i><span> Mis Equipos</span>
                </a>
                <a href="../../pages/analisis/analisis_alumnos.html" class="menu-item">
                    <i class="fas fa-chart-pie"></i><span> Análisis</span>
                </a>
                <a href="../../pages/duales/mis_duales.html" class="menu-item">
                    <i class="fas fa-briefcase"></i><span> Duales</span>
                </a>
                <a href="../../pages/estadias/mis_estadias.html" class="menu-item active">
                    <i class="fas fa-building"></i><span> Estadías</span>
                </a>
               
            </nav>
            <div class="sidebar-footer">
                <div class="user-info-sidebar" id="userInfoSidebar"></div>
                <button class="btn-cerrar-sesion" onclick="cerrarSesion()">
                    <i class="fas fa-sign-out-alt"></i><span> Cerrar sesión</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="estadias-container">
                <div class="header-estadias">
                    <h2><i class="fas fa-building"></i> <span id="tituloEstadias">Mis Estadías</span></h2>
                    <!-- Botón solo visible para ALUMNOS -->
                    <button id="btnCrearEstadia" class="btn primario" style="display: none;">
                        <i class="fas fa-plus-circle"></i> Solicitar Estadía
                    </button>
                </div>

                <div id="mensaje" class="mensaje"></div>

                

                <!-- Filtros -->
                <div class="filtros-estadias" style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
                    <select id="filtroEstado" class="btn secundario" style="width: auto;">
                        <option value="todos">Todos los estados</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="en-curso">En curso</option>
                        <option value="completada">Completada</option>
                        <option value="cancelada">Cancelada</option>
                    </select>
                    <input type="text" id="filtroBusqueda" placeholder="Buscar por empresa o proyecto..." style="flex: 1; max-width: 300px;">
                    <input type="date" id="filtroFechaInicio" title="Fecha desde">

                    <input type="date" id="filtroFechaFin" title="Fecha hasta">
                    <button type="button" id="btnLimpiarFiltros" class="btn secundario">
                        <i class="fas fa-times"></i> Limpiar
                    </button>
                </div>

                <div id="estadiasContainer" class="estadias-grid">
                    <div class="sin-estadias">
                        <i class="fas fa-spinner fa-pulse"></i> Cargando estadías...
                    </div>
                </div>
            </div>

            <!-- Modal de confirmación para eliminar -->
            <div id="modalConfirmarEstadia" class="modal-confirmar" style="display: none;">
                <div class="modal-confirmar-contenido">
                    <div class="modal-confirmar-header">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Confirmar eliminación</h3>
                    </div>
                    <div class="modal-confirmar-body">
                        <p>¿Estás seguro de que quieres eliminar esta estadía?</p>
                        <p class="modal-advertencia">Esta acción no se puede deshacer.</p>
                    </div>
                    <div class="modal-confirmar-footer">
                        <button id="btnCancelarEliminarEstadia" class="btn secundario">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                        <button id="btnConfirmarEliminarEstadia" class="btn-danger">
                            <i class="fas fa-trash-alt"></i> Eliminar
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/menu.js"></script>
    <script src="../../js/estadias.js"></script>
</body>
</html>
