     ============================================ -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnify | Chat del Equipo</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/chat.css">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/modal_editar_perfil.css">
    <link rel="stylesheet" href="../css/temas_oscuro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="menu-lateral">
    <div class="app-container">
        
        <!-- ============================================ -->
        <!-- MENÚ LATERAL                                 -->
        <!-- ============================================ -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-graduation-cap"></i><span> Learnify</span></h2>
            </div>
            <nav class="sidebar-nav">
                <a href="../dashboard.html" class="menu-item">
                    <i class="fas fa-chart-line"></i><span> Dashboard</span>
                </a>
                <a href="mis_equipos.html" class="menu-item">
                    <i class="fas fa-users"></i><span> Mis Equipos</span>
                </a>
                <a href="analisis/analisis_alumnos.html" class="menu-item">
                    <i class="fas fa-chart-pie"></i><span> Análisis</span>
                </a>
                <a href="duales/mis_duales.html" class="menu-item">
                    <i class="fas fa-briefcase"></i><span> Duales</span>
                </a>
                <a href="estadias/mis_estadias.html" class="menu-item">
                    <i class="fas fa-building"></i><span> Estadías</span>
                </a>
                  <a href="pages/minutas/mis_minutas.html" class="menu-item">
                    <i class="fas fa-file-alt"></i><span> Minutas</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info-sidebar" id="userInfoSidebar"></div>

                <button class="btn-cerrar-sesion" onclick="cerrarSesion()">
                    <i class="fas fa-sign-out-alt"></i><span> Cerrar sesión</span>
                </button>
            </div>
        </aside>

        <!-- ============================================ -->
        <!-- CONTENIDO PRINCIPAL                          -->
        <!-- ============================================ -->
        <main class="main-content">
            <div class="page-container">

                <!-- Botón volver -->
                <div class="back-button-wrapper">
                    <a href="mis_equipos.html" class="btn btn-outline btn-sm">
                        <i class="fas fa-arrow-left"></i> Volver a mis equipos
                    </a>
                </div>

                <!-- Contenedor del chat -->
                <div class="chat-container">
                    <!-- Header del chat -->
                    <div class="chat-header">
                        <div class="chat-header-left">
                            <i class="fas fa-comments"></i>
                            <div>
                                <h3 id="chatTitulo">Chat del equipo</h3>
                                <span class="chat-subtitle" id="chatSubtitle">Conectado</span>
                            </div>
                        </div>
                        <div class="chat-header-right">
                            <span class="chat-status connected" id="estadoChat">
                                <i class="fas fa-circle"></i> Conectado
                            </span>
                            <button class="btn btn-outline btn-sm btn-refresh" onclick="cargarMensajes()" title="Actualizar">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Área de mensajes (ID CORRECTO: chatMensajes) -->
                    <div class="chat-mensajes" id="chatMensajes">
                        <div class="empty-message">
                            <i class="fas fa-inbox"></i> Cargando mensajes...
                        </div>
                    </div>

                    <!-- Input de mensaje -->
                    <div class="chat-input-area">
                        <div class="chat-input-wrapper">
                            <i class="fas fa-keyboard input-icon"></i>
                            <input type="text" id="mensajeInput" placeholder="Escribe un mensaje..." maxlength="500">
                            <button id="btnEnviar" class="btn btn-primary btn-send">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                        <div class="chat-input-hint">
                            <i class="fas fa-info-circle"></i> Presiona Enter para enviar
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- ============================================ -->
    <!-- SCRIPTS (orden importante)                   -->
    <!-- ============================================ -->
    <script src="../js/menu.js"></script>
    <script src="../js/chat.js"></script>
</body>
</html>
