name: CI Learnify

# Cuándo se ejecuta: en cada push a estas ramas y en cada pull request hacia main o develop
on:
  push:
    branches: [main, develop, facture/pipeline]
  pull_request:
    branches: [main, develop]

jobs:
  # ETAPA 1: BUILD
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno (Python 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build - verificar que el código compila
        run: python -m compileall -q backend

      - name: Build - verificar que el servidor se puede importar
        working-directory: backend
        run: python -c "import app; print('Servidor importado correctamente')"

  # ETAPA 2: PRUEBAS (solo corre si el Build fue exitoso)
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    needs: build

    # MongoDB temporal que GitHub enciende solo para esta etapa
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://localhost:27017/?serverSelectionTimeoutMS=3000

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno (Python 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Pruebas de integración (API + MongoDB)
        working-directory: backend
        run: python -m pytest tests/test_integracion.py -v --junitxml=resultados-integracion.xml

      - name: Pruebas funcionales (flujos completos)
        if: always()
        working-directory: backend
        run: python -m pytest tests/test_funcionales.py -v --junitxml=resultados-funcionales.xml

      - name: Guardar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: backend/resultados-*.xml
          if-no-files-found: ignore

  # ETAPA 3: REPORTE DE RESULTADOS (siempre se ejecuta)
  reporte:
    name: Reporte de resultados
    runs-on: ubuntu-latest
    needs: [build, test]
    if: always()
    steps:
      - name: Mostrar resumen
        run: |
          echo "## Resultado del pipeline" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Pruebas: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Pipeline fallido (reportar error)
        if: needs.build.result != 'success' || needs.test.result != 'success'
        run: |
          echo "El pipeline falló o no pudo ejecutar las pruebas."
          echo "Build: ${{ needs.build.result }} | Pruebas: ${{ needs.test.result }}"
          exit 1