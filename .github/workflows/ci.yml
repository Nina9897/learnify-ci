name: CI Learnify

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ETAPA 1: CALIDAD Y BUILD
  calidad:
    name: 1 - Calidad y build
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Análisis estático con Ruff
        run: ruff check backend tests

      - name: Build - verificar que el código compila
        run: python -m compileall -q backend tests

      - name: Build - verificar que el servidor se puede importar
        working-directory: backend
        run: python -c "import app; print('Servidor importado correctamente')"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Frontend - verificar sintaxis de los archivos JavaScript
        run: |
          fallos=0
          for f in frontend/js/*.js; do
            node --check "$f" || { echo "::error file=$f::Error de sintaxis"; fallos=1; }
          done
          exit $fallos

  # ETAPA 2: PRUEBAS (solo si la etapa 1 pasó)
  pruebas:
    name: 2 - Pruebas automatizadas
    runs-on: ubuntu-latest
    needs: calidad

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://localhost:27017/?serverSelectionTimeoutMS=3000
      PYTHONPATH: backend
      COVERAGE_FILE: ${{ github.workspace }}/.coverage

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pruebas unitarias
        run: >
          python -m pytest tests
          --cov=app --cov-report=
          --junitxml=resultados-unitarias.xml

      - name: Pruebas de integración y funcionales (API + MongoDB)
        if: always()
        working-directory: backend
        run: >
          python -m pytest tests
          --cov=app --cov-append --cov-report=
          --junitxml=../resultados-integracion-funcionales.xml

      - name: Resumen de resultados y cobertura
        if: always()
        run: |
          python scripts/resumen_pruebas.py resultados-*.xml >> "$GITHUB_STEP_SUMMARY"
          echo '### Cobertura de código (app.py)' >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
          coverage xml -o coverage.xml || true

      # Rechaza si hay pruebas fallidas u omitidas
      - name: Verificar que no haya pruebas fallidas ni omitidas
        if: always()
        run: python scripts/resumen_pruebas.py --estricto resultados-*.xml > /dev/null

      - name: Guardar reportes como artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas
          path: |
            resultados-*.xml
            coverage.xml
          if-no-files-found: warn

  # ETAPA 3: RESULTADO FINAL (siempre se ejecuta)
  resultado:
    name: Resultado del pipeline
    runs-on: ubuntu-latest
    needs: [calidad, pruebas]
    if: always()
    steps:
      - name: Evaluar resultado
        run: |
          echo "## Resultado del pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "- Etapa 1 (Calidad y build): ${{ needs.calidad.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Etapa 2 (Pruebas): ${{ needs.pruebas.result }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.calidad.result }}" = "success" ] && [ "${{ needs.pruebas.result }}" = "success" ]; then
            echo "PIPELINE APROBADO: el cambio puede integrarse."
          else
            echo "PIPELINE RECHAZADO: revisa los logs de la etapa que falló."
            exit 1
          fi