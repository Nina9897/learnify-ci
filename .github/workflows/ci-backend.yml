name: CI Pipeline - Learnify

on:
  push:
    branches: [ main, develop, pruebas_unit, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test - Pruebas Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ver estructura
        run: |
          echo "--- Contenido de backend/ ---"
          ls -la
          echo "--- Contenido de tests/ ---"
          ls -la tests/ || echo "NO EXISTE tests/"

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          pip install numpy==2.4.6 --upgrade
          pip install reportlab==4.1.0
          pip install pytest pytest-flask mongomock

      - name: Ejecutar pruebas
        run: pytest tests/ -v
