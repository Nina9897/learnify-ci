name: CI Pipeline - Learnify

on:
  push:
    branches: [ main, develop, pruebas_unit, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ============================================
  # JOB 1: BUILD (Tu pipeline - pruebas_unit)
  # ============================================
  build:
    name: Build - Preparar proyecto
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar que la app se puede importar
        run: |
          cd backend
          python -c "import app; print('App importada correctamente')"

  # ============================================
  # JOB 2: TEST (Tu pipeline - pruebas_unit)
  # ============================================
  test:
    name: Test - Ejecutar pruebas
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Ejecutar pruebas con Pytest
        run: |
          pytest tests/ -v --tb=short

  # ============================================
  # JOB 3: RESULTS (Tu pipeline - pruebas_unit)
  # ============================================
  results:
    name: Results - Reportar resultado
    runs-on: ubuntu-latest
    needs: [build, test]
    if: always()
    
    steps:
      - name: Verificar resultado del pipeline
        run: |
          echo "=========================================="
          echo "RESULTADO DEL PIPELINE - LEARNIFY"
          echo "=========================================="
          echo "Build: ${{ needs.build.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "=========================================="
          
          if [ "${{ needs.build.result }}" == "success" ] && [ "${{ needs.test.result }}" == "success" ]; then
            echo "PIPELINE EXITOSO - Todas las etapas pasaron"
            echo "El codigo esta listo para hacer merge"
            exit 0
          else
            echo "PIPELINE FALLIDO"
            echo "Revisa los logs de los jobs anteriores para mas informacion"
            exit 1
          fi

  # ============================================
  # PIPELINE DE DEVELOP (Conservado como evidencia)
  # ============================================
  build-develop:
    name: Build (Develop)
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno (Python 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build - verificar que el código compila
        run: python -m compileall -q backend

      - name: Build - verificar que el servidor se puede importar
        working-directory: backend
        run: python -c "import app; print('Servidor importado correctamente')"

  test-develop:
    name: Pruebas (Develop)
    runs-on: ubuntu-latest
    needs: build-develop

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://localhost:27017/?serverSelectionTimeoutMS=3000

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno (Python 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Pruebas de integración (API + MongoDB)
        working-directory: backend
        run: python -m pytest tests/test_integracion.py -v --junitxml=resultados-integracion.xml

      - name: Pruebas funcionales (flujos completos)
        if: always()
        working-directory: backend
        run: python -m pytest tests/test_funcionales.py -v --junitxml=resultados-funcionales.xml

      - name: Guardar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas-develop
          path: backend/resultados-*.xml
          if-no-files-found: ignore

  reporte-develop:
    name: Reporte de resultados (Develop)
    runs-on: ubuntu-latest
    needs: [build-develop, test-develop]
    if: always()
    steps:
      - name: Mostrar resumen
        run: |
          echo "## Resultado del pipeline (Develop)" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build-develop.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Pruebas: ${{ needs.test-develop.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Pipeline fallido (reportar error)
        if: needs.build-develop.result != 'success' || needs.test-develop.result != 'success'
        run: |
          echo "El pipeline falló o no pudo ejecutar las pruebas."
          echo "Build: ${{ needs.build-develop.result }} | Pruebas: ${{ needs.test-develop.result }}"
          exit 1